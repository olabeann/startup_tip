/* startup_tip_ redesign — bright editorial dashboard inspired by the reference */
:root{--bg:#ffffff;--surface:#fff;--ink:#202631;--muted:#8e98aa;--navy:#18294d;--accent:#075fe9;--accentDark:#0047bc;--line:#e9edf5;--mint:#eef6ff;--shadow:0 5px 23px rgba(61,83,135,.036)}
body{background:#fff;color:#202631;font-size:14px}
.wrap{max-width:1232px;padding:0 28px}
.topbar{height:83px;position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid #f0f2f7;backdrop-filter:blur(15px)}
.topbar-in{gap:20px}
.brand{gap:9px;flex-shrink:0;text-decoration:none}
.brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(142deg,#237aff,#0750d1);box-shadow:none}
.brand-text{font-size:20px;color:#182e65;font-weight:900;letter-spacing:-.9px}
.brand-text>span,.footer-brand>span{color:#267bff}
.nav-links{display:flex;align-items:center;justify-content:center;gap:29px;flex:1}
.nav-links a{color:#404b61;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible{color:#075fe9}
.top-actions{gap:11px}
.source-chip{font-size:10px;color:#98a3b4;background:#f6f8fd;border-radius:7px;font-weight:700;padding:9px 11px}
.button{border-color:#dde6f2;border-radius:9px;padding:10px 15px;color:#496180}
.button-dark{background:#115cef;color:#fff;border-color:#115cef;box-shadow:0 4px 10px #125beb19;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.button-dark:hover{background:#034bcb;border-color:#034bcb;color:#fff}
.button-subtle{background:#f7f9fd;color:#63799b;border:1px solid #edf1f8}
.main{padding-top:42px;padding-bottom:10px}
.overline{font-size:9.5px;letter-spacing:1.65px;font-weight:850;color:#5682ce;display:inline-block;margin-bottom:11px}
.welcome{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:start}
.welcome>div{min-width:0}
.column-heading{min-height:97px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.column-heading h1,.column-heading h2{font-size:18px;line-height:1.37;letter-spacing:-.8px;margin:0;font-weight:900;color:#252a35}
.column-heading h1{font-size:19px}
.heading-deco{font-size:30px;line-height:1.15;color:#c1b0f9;flex-shrink:0;margin-top:20px;transform:rotate(-15deg)}
.heading-coin{color:#f8b45a;font-size:27px}
.hero-primary{height:263px;position:relative;overflow:hidden;border-radius:15px;background:linear-gradient(152deg,#278aff 0%,#1468ec 46%,#0046c6 100%);padding:22px 22px 20px;color:#fff;isolation:isolate;box-shadow:0 9px 19px #1168d319}
.hero-primary::after{content:"";position:absolute;width:215px;height:215px;right:-97px;top:-60px;border-radius:50%;border:30px solid rgba(255,255,255,.08);z-index:-1}
.hero-pill{display:inline-flex;border:1px solid #ffffff75;border-radius:30px;padding:5px 10px;color:#f4f8ff;font-size:10px;font-weight:750;position:relative;z-index:1;background:#ffffff12}
.hero-primary h2{font-size:20px;line-height:1.33;font-weight:900;letter-spacing:-.9px;margin:15px 0 8px;position:relative;z-index:1}
.hero-primary p{font-size:11.5px;line-height:1.6;color:#deeeff;margin:0;position:relative;z-index:1}
.hero-white-btn{position:absolute;bottom:19px;left:20px;border:0;background:#fff;color:#0b58d4;border-radius:8px;padding:10px 13px;font-size:11px;font-weight:850;box-shadow:0 7px 14px #002e8826;z-index:2}
.hero-white-btn span{padding-left:8px}
.hero-white-btn:hover{background:#eaf2ff}
.plane-deco{position:absolute;z-index:0;right:-4px;bottom:35px;width:132px;height:132px;transform:rotate(12deg);filter:drop-shadow(0px 12px 12px #123a9140);opacity:.92;pointer-events:none}
.hero-orbit{position:absolute;border-radius:50%;border:1px solid #ffffff23;z-index:-1;pointer-events:none}
.hero-orbit-one{right:-35px;bottom:-50px;width:182px;height:182px}.hero-orbit-two{right:12px;bottom:40px;width:86px;height:86px}
.micro-banner{height:36px;padding:0 12px;display:flex;gap:8px;align-items:center;border-radius:8px;background:#283759;color:#f6f8ff;margin-top:13px;font-size:10px;white-space:nowrap}
.micro-banner>span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis}
.micro-badge{padding:3px 5px;border-radius:4px;background:#a4baff;color:#172e70;font-size:9px;font-weight:900}
.micro-insight{display:flex;align-items:center;gap:11px;margin-top:15px;padding:3px 5px;color:#a5aec2}
.mini-icon{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:#f2eaff;color:#784ddc;font-size:17px;flex-shrink:0}
.micro-insight>div:nth-child(2){flex:1;min-width:0}
.micro-insight strong,.micro-insight small{display:block;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micro-insight strong{color:#3c4662;font-size:10.5px;font-weight:800}.micro-insight small{color:#98a2b5;font-size:10px;margin-top:3px}
.steps-panel{height:350px;border:1px solid #eceff5;background:#fff;border-radius:16px;padding:4px 18px;box-shadow:0 6px 26px #46598308;display:flex;flex-direction:column;justify-content:space-around}
.step-row{padding:17px 0;display:flex;align-items:center;gap:13px;width:100%;min-height:82px;border:0;border-bottom:1px solid #edf0f6;background:transparent;color:#243047;text-decoration:none;text-align:left}
.step-row:last-child{border-bottom:0}.step-row:hover .step-icon{background:#ecf3ff;color:#055be0}.step-row:hover .step-arrow{color:#0666ed;transform:translateX(3px)}

.main .work-intro{margin-top:24px}
.save-panel{max-width:680px;margin:32px auto;padding:clamp(20px,5vw,44px)}

.pick{padding:24px;background:white;border:1px solid #dce5f2;border-radius:18px;overflow-wrap:anywhere}

.pick details{margin-top:18px;border-top:1px solid #93a8ce;padding-top:12px}
.pick summary{cursor:pointer}.pick details p{white-space:pre-line;line-height:1.65}
.pick-links{display:flex;gap:8px;flex-wrap:wrap}.pick-next{display:block;text-align:center;margin:12px}

/* Card comparison results */
.result-list{gap:16px;align-items:start}
.credit-card{container-type:inline-size;padding:20px 20px 0;border:1px solid #dbe3ef;border-radius:16px;background:#fff;box-shadow:0 3px 12px #243c6309}

.card-main{display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 12px;align-items:start}
.card-index{display:grid;place-items:center;height:36px;padding:0;border-radius:11px;background:#eef2f8;color:#4b607e;font-size:13px;font-variant-numeric:tabular-nums}

.card-kind,.top-badge{font-size:11px}

.result-list .card-miles strong{font-size:24px!important;color:#164fa9;margin:0}
.card-metrics{background:none;margin:0;padding:16px 0}

.is-selected .compare-check{color:#184fa8;background:#edf4ff;border-color:#a9c6f1}
.view-comparison{color:#184fa8;font-weight:700}

      <p>한 달의 소비를 한눈에 정리해 보세요. 쓰는 항목에 월평균 카드 결제금액을 입력하면 돼요.</p></header>
      <div class="ledger-help-above"><details class="ledger-help-details"><summary>사용 방법 · 입력 안내</summary><div class="ledger-help-body">
<h2 class="usage-title">사용 방법</h2>
<ol class="usage-steps">
<li>마일리지 적립 카드로 <strong>한 달 동안 결제할 금액</strong>을 업종별로 입력하세요.</li>
<li>매월 발생하는 지출이 아니라면 <strong>연간 지출 금액을 12로 나누어</strong> 입력하세요.<div class="usage-example">예시 · 세금을 연 1회 48만 원 납부한다면<br><strong>48만 원 ÷ 12개월 = 월 4만 원 입력</strong></div></li>
<li><strong>‘계산 결과 보기’</strong> 버튼을 눌러 월 예상 적립 마일리지와 연간 누적 마일리지를 확인하세요. 전체 카드 비교에서 적립액과 연회비를 함께 살펴보고 나에게 맞는 카드를 찾아보세요.</li>
</ol>
<div class="usage-notes"><p>같은 결제는 한 번만 입력하고, 해외 결제·직구는 ‘해외 소비’에 모아 주세요. 현금·계좌이체 금액은 제외해 주세요.</p><p>예상 적립에는 구매처별 추가 적립과 제외 조건이 모두 반영되지 않습니다. 실제 적립은 카드별 조건에 따라 달라집니다.</p><p>기존 저장 금액은 유지됩니다. 항목을 옮길 때는 기존 항목에서 같은 금액을 빼 주세요.</p></div>
</div></details></div>

let overrides={}; let engine=null;
function money(n){return fmt.format(Math.round(Number(n)||0));}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({amounts,question,hasSpendingInput,purposeVersion:2,allocations,enabledOptions:[...enabledOptions]}))}catch(e){}}
function recalc(){overrides=Object.fromEntries(originalInputs.map(x=>['입력!'+x.ref,0]));for(const item of DATA.inputs.filter(isInputEnabled)){const parts=allocations[item.ref]||{[item.target]:Number(amounts[item.ref])||0};for(const [ref,n] of Object.entries(parts))overrides['입력!'+ref]+=n;}overrides['입력!E62']=question;engine=createFormulaEngine(DATA,overrides);}
function checkedGet(ref){try{return Number(engine.get('입력',ref))}catch(e){console.error('계산 오류',ref,e);return NaN}}
function computeCards(){return DATA.cards.map(card=>Object.assign({},card,{
  month:checkedGet(card.monthly),annualMiles:checkedGet(card.annual),netMiles:checkedGet(card.net),rateMiles:checkedGet(card.rate),
  year2Miles:card.year2?checkedGet(card.year2):null,additional:card.extraValue?checkedGet(card.extraValue):null
}));}
let results=[];
function isInputEnabled(item){return !item.option||enabledOptions.has(item.option)}
function getInputTotal(){return DATA.inputs.filter(isInputEnabled).reduce((v,x)=>v+(Number(amounts[x.ref])||0),0)}
function getGroupTotal(group){return DATA.inputs.filter(x=>x.group===group&&isInputEnabled(x)).reduce((v,x)=>v+(Number(amounts[x.ref])||0),0)}
function renderInputs(force=false){
  const groups=[];for(const x of DATA.inputs.filter(x=>!x.option||enabledOptions.has(x.option))){let last=groups[groups.length-1];if(!last||last.name!==x.group)groups.push({name:x.group,items:[x]});else last.items.push(x)}
  const box=$('inputGroups');
  if(!force&&box.children.length){
    for(const g of box.querySelectorAll('[data-group-total]'))g.textContent=won(getGroupTotal(g.dataset.groupTotal));
    return;
  }
  const search=(inputQuery||'').trim().toLowerCase();
  box.innerHTML=groups.map((g,i)=>{
    const visible=g.items.filter(x=>!search||[g.name,x.label].join(' ').toLowerCase().includes(search));
    if(!visible.length)return '';

    return `<section class="spend-group tone-${i % 4}">
      <h2 class="entry-category"><span class="group-label"><span class="category-index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span>${esc(g.name)}</span>${g.items.length>1?`<span class="category-sum"><small>소계</small><span class="group-amount" data-group-total="${esc(g.name)}">${won(getGroupTotal(g.name))}</span></span>`:''}</h2>
      <div class="group-fields">${visible.map(x=>`<div class="spend-entry"><label class="spend-row"><span class="spend-label">${esc(x.label || '기타 지출')}${x.hint?`<small class="spend-hint">${esc(x.hint)}</small>`:''}</span><span class="money-input-wrap"><input type="text" inputmode="numeric" data-amount="${x.ref}" aria-label="${esc(x.label || '쇼핑 (항목명 미지정)')} 월 카드 결제금액" value="${esc(money(amounts[x.ref]))}" autocomplete="off"><span>원</span></span></label></div>`).join('')}</div>
    </section>`;
  }).join('') || '<p>검색한 지출 항목이 없습니다.</p>';
}
function cardList(){
  let list=results.filter(x=>(showDiscontinued||!x.discontinued)&&(tab==='all'||x.type===tab));
  if(query){const q=query.toLowerCase();list=list.filter(x=>[x.name,x.benefits,x.extra,x.type].join(' ').toLowerCase().includes(q));}
  const compare={'net':(a,b)=>b.netMiles-a.netMiles,'annual':(a,b)=>b.annualMiles-a.annualMiles,'rate':(a,b)=>b.rateMiles-a.rateMiles,'fee':(a,b)=>a.fee-b.fee,'month':(a,b)=>b.month-a.month};
  return list.sort((a,b)=>compare[sortBy](a,b)||a.name.localeCompare(b.name,'ko'));
}
function renderComparison(){
  const chosen=results.filter(c=>selected.has(c.id));
  $('compareCount').textContent=chosen.length;
  $('compareBar').hidden=!chosen.length;
  document.body.classList.toggle('has-compare-bar',!!chosen.length);
  $('compareBarCount').textContent=chosen.length+'/3';
  $('openCompare').textContent=chosen.length+'개 카드 비교하기';
  $('compareChips').innerHTML=chosen.map(c=>'<button type="button" class="compare-chip" data-remove="'+c.id+'" aria-label="'+esc(c.name)+' 선택 해제"><span>'+esc(c.name)+'</span><b aria-hidden="true">×</b></button>').join('');
  if(!chosen.length && $('compareDialog').open) $('compareDialog').close();
  $('comparison').innerHTML=chosen.length?`<div class="comparison-swipe-note">${chosen.length===3?'좌우로 밀어 3장의 카드를 비교하세요.':'같은 항목의 금액을 좌우로 비교해 보세요.'}</div><div class="compare-scroll" role="region" aria-label="선택 카드 비교표" tabindex="0"><table class="comparison-table compare-count-${chosen.length}"><colgroup><col class="comparison-label-column">${chosen.map(()=>'<col class="comparison-value-column">').join('')}</colgroup><thead><tr><th scope="col">비교 항목</th>${chosen.map(c=>`<th>${esc(c.name)} <button aria-label="비교 제거" class="remove-comp" data-remove="${c.id}">×</button></th>`).join('')}</tr></thead><tbody>
    <tr><td>연간 실질 적립</td>${chosen.map(c=>`<td class="best-stat">${mil(c.netMiles)}</td>`).join('')}</tr>
    <tr><td>월 예상 마일리지</td>${chosen.map(c=>`<td>${mil(c.month)}</td>`).join('')}</tr>
    <tr><td>연간 예상 마일리지</td>${chosen.map(c=>`<td>${mil(c.annualMiles)}</td>`).join('')}</tr>
    <tr><td>연회비</td>${chosen.map(c=>`<td>${won(c.fee)}</td>`).join('')}</tr>
    <tr><td>1,000원당 적립 효율</td>${chosen.map(c=>`<td>${Number.isFinite(c.rateMiles)?c.rateMiles.toFixed(2)+'마일':'—'}</td>`).join('')}</tr>
    <tr><td>제공 혜택</td>${chosen.map(c=>`<td>${esc(c.benefits||'별도 표기 없음')}</td>`).join('')}</tr>
    </tbody></table></div>`:'';
}

function renderResults(){
  const list=cardList(),shown=list;
  $('resultCount').textContent='표시 중 '+list.length+'종';
  $('tabAllCount').textContent=results.filter(c=>showDiscontinued||!c.discontinued).length;
  $('tabBasicCount').textContent=results.filter(c=>c.type==='일반 카드'&&(showDiscontinued||!c.discontinued)).length;
  $('tabHyundaiCount').textContent=results.filter(c=>c.type==='현대카드'&&(showDiscontinued||!c.discontinued)).length;
  if(!list.length){$('resultList').innerHTML='<div class="empty">조건에 맞는 카드가 없습니다.<br>검색어 또는 필터를 변경해 주세요.</div>';}else{
    $('resultList').innerHTML=shown.map((c,i)=>{
      const open=expanded.has(c.id),compare=selected.has(c.id);
      const featured=i===0 && sortBy==='net'&&!query;
      return `<article class="credit-card ${compare?'is-selected':''} ${featured?'highlight-card':''}" data-card="${c.id}">
        <div class="card-main"><div class="card-index" aria-label="${i+1}위">${String(i+1).padStart(2,'0')}</div>
          <div class="card-text"><div class="card-heading-row"><div class="card-tags"><span class="card-kind">${esc(c.type)}</span>${featured?'<span class="top-badge">실질 적립 1위</span>':''}${c.discontinued?'<span class="dead-badge">단종</span>':''}</div><label class="compare-check"><input type="checkbox" data-compare="${c.id}" ${compare?'checked':''} ><span>${compare?'선택됨':'비교 선택'}</span></label></div>
          <h3>${esc(c.name)}</h3><div class="card-fee">연회비 ${won(c.fee)}</div></div>
          <div class="card-miles"><small>연간 실질 적립</small><strong>${mil(c.netMiles)}</strong></div>
        </div><div class="card-metrics"><div><span>월 예상 적립</span><strong>${mil(c.month)}</strong></div><div><span>연간 총 적립</span><strong>${mil(c.annualMiles)}</strong></div><div><span>1,000원당</span><strong>${Number.isFinite(c.rateMiles)?c.rateMiles.toFixed(2)+'마일':'—'}</strong></div></div>
        ${open?`<div class="detail-panel"><div><span class="detail-key">혜택 및 조건</span><p>${esc(c.benefits||'원본 엑셀에 별도 표기된 혜택이 없습니다.').replace(/\n/g,'<br>')}</p></div>${c.year2Miles!==null?`<div><span class="detail-key">2년 차 이후 연간 적립 (원본 계산)</span><p class="detail-strong">${mil(c.year2Miles)}</p></div>`:''}${c.extra?`<div><span class="detail-key">기타 참고</span><p>${esc(c.extra)}</p>${c.additional!==null?`<strong>${mil(c.additional)}</strong>`:''}</div>`:''}${c.id==='aBH'?'<div class="error-notice">이 카드는 원본에 외부 통합문서 참조가 남아 있어 저장된 결과 대신 현재 입력값으로 수식을 재계산했습니다.</div>':''}</div>`:''}
        <div class="card-actions"><button class="detail-button" data-detail="${c.id}" aria-expanded="${open}">${open?'혜택 접기':'혜택 자세히'} <span aria-hidden="true">${open?'−':'+'}</span></button></div>
      </article>`;
    }).join('');
  }
  renderComparison();
}
function refresh(){renderInputs();$('totalInput').textContent=won(getInputTotal());}
function showToast(msg){const n=$('toast');n.textContent=msg;n.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>n.classList.remove('show'),2000)}
function setupInputs(){
  refresh();
  const fields = $('inputGroups');
  const picker=$('optionalCategories');
  function renderPicker(){picker.innerHTML=optionalSpecs.map(([id,label])=>'<button type="button" class="button button-subtle" data-add-option="'+id+'" '+('aria-pressed="'+enabledOptions.has(id)+'"')+'>'+ (enabledOptions.has(id)?'✓ ':'+ ')+esc(label)+'</button>').join('');}
  renderPicker();
  picker.addEventListener('click',event=>{
    const button=event.target.closest('[data-add-option]');if(!button)return;
    const option=button.dataset.addOption;
    if(enabledOptions.has(option))enabledOptions.delete(option);else enabledOptions.add(option);
    inputQuery='';$('inputFilter').value='';
    save();renderInputs(true);renderPicker();refresh();
    picker.querySelector('[data-add-option="'+option+'"]').focus({preventScroll:true});
  });
  fields.addEventListener('focusin', event => {
    if (event.target.matches('[data-amount]')) event.target.select();
  });
  fields.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || !event.target.matches('[data-amount]')) return;
    event.preventDefault();
    const inputs = Array.from(fields.querySelectorAll('[data-amount]'));
    const next = inputs[inputs.indexOf(event.target) + 1];
    (next || document.querySelector('.entry-total a')).focus();
  });
  $('inputGroups').addEventListener('input',e=>{
    const ref=e.target.dataset.amount;if(!ref)return;
    let cleaned=e.target.value.replace(/[^0-9]/g,'');
    let num=Math.min(10000000000,Number(cleaned)||0);
    amounts[ref]=num;delete allocations[ref];
    hasSpendingInput = true;
    const next=e.target.selectionStart,oldlen=e.target.value.length;
    e.target.value=money(num);
    try{e.target.setSelectionRange(Math.max(0,next+e.target.value.length-oldlen),Math.max(0,next+e.target.value.length-oldlen))}catch(e){}
    save();refresh();
  });
  $('inputFilter').addEventListener('input',e=>{inputQuery=e.target.value;renderInputs(true);});
  document.querySelectorAll('[data-question]').forEach(btn=>btn.addEventListener('click',()=>{question=btn.dataset.question;document.querySelectorAll('[data-question]').forEach(x=>x.classList.toggle('active',x.dataset.question===question));save();refresh();}));
  document.querySelector('[data-question="'+question+'"]').classList.add('active');
  $('resetButton').addEventListener('click',()=>{if(!confirm('입력한 금액을 지우고 예시 금액을 채울까요?'))return;
    allocations={};amounts=Object.fromEntries(DATA.inputs.map(x=>[x.ref,0]));Object.assign(amounts,{s1_0:150000,s1_2:50000,s2_0:300000,s2_1:60000,s2_2:200000,s3_0:20000,s4_0:70000,s5_2:50000});question=DATA.questionDefault;hasSpendingInput=false;
    document.querySelectorAll('[data-question]').forEach(x=>x.classList.toggle('active',x.dataset.question===question));renderInputs(true);save();refresh();showToast('예시 소비 금액을 채웠습니다.');});
  $('zeroButton').addEventListener('click',()=>{allocations={};for(const x of DATA.inputs)amounts[x.ref]=0;hasSpendingInput=false;renderInputs(true);save();refresh();showToast('모든 입력 금액을 0원으로 변경했습니다.');});
}
function setupCatalog(){
  recalc();
  results = computeCards();
  showDiscontinued = true;
  $('filterDiscontinued').checked = true;
  $('catalogBasis').textContent = (saved.amounts ? '입력한 월 소비 ' : '예시 월 소비 ') + won(getInputTotal()) + ' 기준 · 전체 ' + results.length + '종에서 최대 3장을 골라 비교하세요.';
  renderResults();
  updateSaveLink();
  $('filterDiscontinued').addEventListener('change',e=>{showDiscontinued=e.target.checked;renderResults();});
  document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{tab=x.dataset.tab;document.querySelectorAll('[data-tab]').forEach(y=>y.classList.toggle('active',y===x));renderResults();}));
  $('sortSelect').addEventListener('change',e=>{sortBy=e.target.value;renderResults();});
  $('cardSearch').addEventListener('input',e=>{query=e.target.value.trim();renderResults();});
  $('resultList').addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(!b)return;expanded.has(b.dataset.detail)?expanded.delete(b.dataset.detail):expanded.add(b.dataset.detail);renderResults();});
  $('resultList').addEventListener('change',e=>{const input=e.target.closest('[data-compare]');if(!input)return;const id=input.dataset.compare;
    if(input.checked&&selected.size>=3){input.checked=false;showToast('최대 3개 카드를 비교할 수 있습니다.');return;}
    input.checked?selected.add(id):selected.delete(id);renderResults();});
  const dialog=$('compareDialog');
  let comparisonScrollY=0;
  $('openCompare').addEventListener('click',()=>{
    if(!selected.size)return;
    comparisonScrollY=window.scrollY;
    dialog.showModal();document.body.classList.add('comparison-open');
  });
  $('closeCompare').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{
    document.body.classList.remove('comparison-open');
    window.scrollTo(0,comparisonScrollY);
    if(selected.size)$('openCompare').focus({preventScroll:true});
    else $('cardSearch').focus({preventScroll:true});
  });
  dialog.addEventListener('click',event=>{
    if(event.target!==dialog)return;
    const r=dialog.getBoundingClientRect();
    if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();
  });
  $('compareChips').addEventListener('click',event=>{
    const button=event.target.closest('[data-remove]');if(!button)return;
    selected.delete(button.dataset.remove);renderResults();
    if(selected.size)$('openCompare').focus({preventScroll:true});
    else $('cardSearch').focus({preventScroll:true});
  });
  $('clearCompare').addEventListener('click',()=>{selected.clear();renderResults();});
  $('comparison').addEventListener('click',e=>{let b=e.target.closest('[data-remove]');if(!b)return;selected.delete(b.dataset.remove);renderResults();});
  function updateSaveLink() {
    const filters = new URLSearchParams({page: 'save', tab, sort: sortBy, q: query});
    if (showDiscontinued) filters.set('discontinued', '1');
    document.querySelector('.top-actions a').href = '?' + filters;
  }
  document.addEventListener('input', updateSaveLink);
  document.addEventListener('change', updateSaveLink);
  document.addEventListener('click', event => {
    if (event.target.closest('[data-tab]')) updateSaveLink();
  });
}
function setupExport() {
  if (!canExport) {
    $('exportSummary').textContent = '월 소비 금액을 입력하면 계산 결과를 저장할 수 있어요.';
    $('downloadCsv').remove();
    return;
  }
  tab = params.get('tab') || 'all';
  const sort = params.get('sort');
  sortBy = ['annual', 'month', 'rate', 'fee'].includes(sort) ? sort : 'net';
  query = params.get('q') || '';
  showDiscontinued = params.get('discontinued') === '1';
  recalc();
  results = computeCards();
  const count = cardList().length;
  $('exportSummary').textContent = '월 소비 금액 ' + won(getInputTotal()) + ' · 저장할 카드 ' + count + '종';
  $('downloadCsv').disabled = count === 0;
  $('downloadCsv').addEventListener('click',()=>{
    const list=cardList(),header=['순위','카드명','카드 종류','연회비(원)','월 적립(M)','연간 적립(M)','연간 실질 적립(M)','1000원당 적립(M)','2년차 적립(M)','단종 여부','혜택'];
    const body=list.map((c,i)=>[i+1,c.name,c.type,c.fee,c.month,c.annualMiles,c.netMiles,c.rateMiles,c.year2Miles??'',c.discontinued?'Y':'N',c.benefits]);
    const csv='\ufeff'+[header,...body].map(r=>r.map(n=>'"'+String(n??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download='startup_tip_대한항공_마일리지_결과.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);showToast('현재 비교 결과 CSV를 저장했습니다.');
  });
}
function setupRecommendations() {
  const total = getInputTotal();
  if (!total) {
    $('pickBasis').textContent = '월 소비 금액을 입력하면 예상 적립액을 기준으로 카드를 추천해 드려요.';
    return;
  }
  recalc();
  results = computeCards();
  const ranked = cardList().filter(card => Number.isFinite(card.netMiles));
  const basis = saved.amounts ? '입력한 월 소비' : '예시 월 소비';
  $('pickBasis').textContent = basis + ' ' + won(total) + ' 기준 · 단종 카드를 제외한 ' + ranked.length +
    '종을 연간 실질 적립순으로 추천해요. 연회비는 1마일당 20원으로 환산해 반영했어요.';
  $('pickList').innerHTML = ranked.slice(0, 3).map((card, index) => `
    <article class="pick">
      <span class="pick-rank">추천 ${index + 1}위</span>
      <h2>${esc(card.name)}</h2>
      <span>연간 실질 적립</span><strong class="pick-value">${mil(card.netMiles)}</strong>
      <p>연간 예상 적립 ${mil(card.annualMiles)} · 연회비 ${won(card.fee)}</p>
      <details><summary>혜택 및 조건 보기</summary><p>${esc(card.benefits || '별도로 등록된 혜택이 없습니다.')}</p></details>
    </article>`).join('');
}
if (page === 'result') setupRecommendations();
else if (page === 'recommend') setupCatalog();
else if (page === 'save') setupExport();
else setupInputs();
})();
</script>
</body></html>
